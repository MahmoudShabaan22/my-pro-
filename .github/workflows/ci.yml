name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # ==================== Job 1: Build ====================
  build-only:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Image (No Push)
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false
          tags: taskflow-backend:test

      - name: Build Frontend Image (No Push)
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: false
          tags: taskflow-frontend:test

      - name: Verify Build Success
        run: |
          echo "✅ Images built successfully on GitHub Runner!"
          docker images 

      - name: Cleanup Docker Images to free space
        if: always()
        run: |
          echo "🧹 Cleaning up Docker images to free up space..."
          docker image prune -af
          echo "✅ Cleanup finished!"

  # ==================== Job 2: Deploy ====================
  deploy:
    # 🔥 هذا السطر مهم جداً: يعني الـ Deploy يشتغل فقط بعد نجاح الـ build-only
    needs: build-only
    runs-on: self-hosted  # ⚠️ سنشرح هذا في الأسفل

    steps:
      - name: Start Docker container
        run: |
          echo "🚀 Deploying application..."
          docker run -d --name my-app -p 8080:80 nginx
      
      - name: Run tests
        run: |
          echo "🧪 Running tests..."
          # هنا يمكنك إضافة أوامر الاختبار مثل curl localhost:8080
      
      - name: Cleanup Docker container
        if: always()
        run: |
          echo " Cleaning up deployed container..."
          docker stop my-app || true
          docker rm my-app || true
          echo "✅ Cleanup completed"
