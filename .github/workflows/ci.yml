name: Local Build Test (No Push)

on:
  push:
    branches:
      - main
jobs:
  build-only:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Image (No Push)
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false
          tags: taskflow-backend:test

      - name: Build Frontend Image (No Push)
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: false
          tags: taskflow-frontend:test

      - name: Verify Build Success
        run: |
          echo "✅ Images built successfully on GitHub Runner!"
          docker images 

      #  الخطوة الجديدة: تنظيف المساحة
      - name: Cleanup Docker Images to free space
        if: always() # 🔥 مهم جداً: تعمل حتى لو الخطوات السابقة فشلت
        run: |
          echo "🧹 Cleaning up Docker images to free up space..."
          docker image prune -af
          echo "✅ Cleanup finished!"

