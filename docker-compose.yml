services:
  backend:
    build: ./backend
    container_name: taskflow-backend
    restart: unless-stopped
    environment:
      - PORT=5000
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - app-network
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=taskflow
      - PORT=5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: taskflow-frontend
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      - backend
  nginx:
    image: nginx:alpine
    container_name: taskflow-nginx
    restart: unless-stopped
    ports:
      - "880:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  